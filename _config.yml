name: Yuzhe Gu
description: "Yuzhe Gu's research in machine learning, language, vision, and multimodal systems."
url: "https://yzguu830.github.io"
baseurl: ""
avatar: /images/profile.webp
google_analytics: G-E00L9PT3V9

# Research entries supply the homepage; they do not generate separate pages.
collections:
  research:
    output: false

kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  style: compressed
plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - scripts
  - _archive
  - favicon.ico
  - images/profile.png
  - images/profile2.JPG
  - images/covid.png
  - images/esc.png
  - images/scd.png
  - images/obcache.png
  - images/fairllm.png
  - images/vgpt.gif
  - pdfs
